<!DOCTYPE html>
<html lang="si" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AuraStream - Mobile YouTube Music Player</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        glassdark: 'rgba(15, 23, 42, 0.75)',
                        glasslight: 'rgba(255, 255, 255, 0.08)',
                        accent: '#8b5cf6',
                        accentGlow: '#c084fc',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 10%, rgb(30, 27, 75) 0%, rgb(11, 15, 25) 85%);
            color: #f8fafc;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-panel {
            background: rgba(18, 24, 38, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.5);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            transition: all 0.25s ease;
        }

        .glass-card:active {
            transform: scale(0.98);
        }

        .glass-input {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
        }

        .glass-input:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.35);
        }

        /* Custom Vertical Range Slider Styling for Modern Browsers */
        input[type=range].vertical-range {
            writing-mode: bt-lr;
            -webkit-appearance: slider-vertical;
            width: 24px;
            height: 140px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            outline: none;
            accent-color: #8b5cf6;
        }

        /* Waveform Animation */
        .waveform-bar {
            width: 3.5px;
            background: linear-gradient(to top, #8b5cf6, #c084fc);
            border-radius: 9999px;
            animation: pulseWave 1.2s ease-in-out infinite alternate;
        }

        @keyframes pulseWave {
            0% { height: 8px; }
            100% { height: 38px; }
        }

        .waveform-bar:nth-child(2) { animation-delay: 0.2s; }
        .waveform-bar:nth-child(3) { animation-delay: 0.4s; }
        .waveform-bar:nth-child(4) { animation-delay: 0.1s; }
        .waveform-bar:nth-child(5) { animation-delay: 0.5s; }
        .waveform-bar:nth-child(6) { animation-delay: 0.3s; }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
        }

        .glow-effect {
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.35);
        }

        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spinSlow 20s linear infinite;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start min-h-screen p-3 sm:p-6 relative selection:bg-purple-500 selection:text-white">

    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-80 h-80 bg-purple-600/15 rounded-full blur-3xl pointer-events-none -z-10"></div>
    <div class="absolute bottom-10 right-10 w-72 h-72 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none -z-10"></div>

    <!-- Hidden YouTube Audio Player -->
    <div id="youtube-player-container" class="hidden">
        <div id="yt-player"></div>
    </div>
    <audio id="audioElement" crossorigin="anonymous" class="hidden"></audio>

    <!-- Main Container - Mobile Optimized -->
    <div class="w-full max-w-md sm:max-w-xl md:max-w-4xl lg:max-w-5xl glass-panel rounded-3xl p-4 sm:p-6 flex flex-col gap-5 relative shadow-2xl">

        <!-- Header -->
        <header class="flex items-center justify-between gap-3 border-b border-white/10 pb-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center glow-effect shadow-lg">
                    <i class="fa-solid fa-music text-white text-base"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold tracking-wide text-white">AuraStream</h1>
                    <p class="text-[11px] text-purple-300 font-medium">YouTube Audio 256kbps HQ</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="toggleModal('eqModal')" title="Equalizer" class="p-2.5 rounded-xl glass-card text-slate-300 hover:text-purple-400 transition-colors">
                    <i class="fa-solid fa-sliders text-sm"></i>
                </button>
                <button onclick="toggleModal('playlistModal')" title="Playlists" class="p-2.5 rounded-xl glass-card text-slate-300 hover:text-purple-400 transition-colors">
                    <i class="fa-solid fa-list-music text-sm"></i>
                </button>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="relative w-full">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                <i class="fa-solid fa-search text-sm"></i>
            </span>
            <input type="text" id="searchInput" placeholder="Search YouTube music, artists, songs..." class="w-full pl-10 pr-10 py-3 rounded-2xl glass-input text-sm text-slate-200 placeholder-slate-400 transition-all">
            <button onclick="performSearch()" class="absolute inset-y-1 right-1 px-3.5 bg-purple-600 hover:bg-purple-500 rounded-xl text-white text-xs font-semibold shadow transition-colors">
                Search
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">

            <!-- Left / Song Library & Search Results (Span 7) -->
            <div class="lg:col-span-7 flex flex-col gap-4">
                <!-- Navigation Tabs -->
                <div class="flex items-center gap-4 border-b border-white/10 pb-2 overflow-x-auto">
                    <button onclick="switchTab('explore')" id="tabExplore" class="text-xs sm:text-sm font-semibold text-purple-400 pb-1 border-b-2 border-purple-500 whitespace-nowrap transition-all">Trending / Explore</button>
                    <button onclick="switchTab('favorites')" id="tabFavorites" class="text-xs sm:text-sm font-medium text-slate-400 pb-1 border-b-2 border-transparent hover:text-slate-200 whitespace-nowrap transition-all">Favorites</button>
                    <button onclick="switchTab('results')" id="tabResults" class="text-xs sm:text-sm font-medium text-slate-400 pb-1 border-b-2 border-transparent hover:text-slate-200 whitespace-nowrap transition-all hidden">Search Results</button>
                </div>

                <!-- Song List -->
                <div id="songContainer" class="flex flex-col gap-2.5 max-h-[380px] sm:max-h-[420px] overflow-y-auto pr-1">
                    <!-- Populated dynamically -->
                </div>
            </div>

            <!-- Right / Now Playing & Thumbnail Display (Span 5) -->
            <div class="lg:col-span-5 glass-card rounded-3xl p-4 sm:p-5 flex flex-col items-center justify-between relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-b from-purple-500/10 via-transparent to-transparent pointer-events-none"></div>

                <div class="w-full flex items-center justify-between z-10 mb-2">
                    <span class="text-[11px] font-semibold uppercase tracking-wider text-purple-300">Now Playing (Audio Only)</span>
                    <button onclick="toggleFavoriteCurrent()" id="nowFavBtn" class="text-slate-400 hover:text-rose-500 transition-colors p-1">
                        <i class="fa-regular fa-heart text-base"></i>
                    </button>
                </div>

                <!-- Prominent Thumbnail (No Video Rendering) -->
                <div class="relative w-40 h-40 sm:w-48 sm:h-48 rounded-full p-2 glass-card flex items-center justify-center shadow-2xl glow-effect my-2 z-10 group">
                    <div class="w-full h-full rounded-full overflow-hidden relative border-2 border-purple-500/30">
                        <img id="currentThumbnail" src="https://placehold.co/400x400/1e293b/c084fc?text=AuraStream" alt="Thumbnail" class="w-full h-full object-cover">
                    </div>
                    <!-- Vinyl spinning animation -->
                    <div class="absolute inset-0 rounded-full border border-white/15 pointer-events-none animate-spin-slow"></div>
                </div>

                <!-- Song Info -->
                <div class="text-center z-10 w-full px-2 mt-1">
                    <h3 id="currentTitle" class="text-sm sm:text-base font-bold text-white truncate">Select a Track</h3>
                    <p id="currentArtist" class="text-xs text-slate-400 truncate mt-0.5">YouTube Music Streamer</p>
                </div>

                <!-- Waveform Bars -->
                <div class="flex items-center justify-center gap-1.5 h-10 my-2 z-10">
                    <div class="waveform-bar"></div>
                    <div class="waveform-bar"></div>
                    <div class="waveform-bar"></div>
                    <div class="waveform-bar"></div>
                    <div class="waveform-bar"></div>
                    <div class="waveform-bar"></div>
                </div>

                <!-- Seek Bar -->
                <div class="w-full z-10 flex flex-col gap-1 my-1">
                    <div class="flex justify-between text-[11px] text-slate-400">
                        <span id="currentTime">0:00</span>
                        <span id="totalDuration">0:00</span>
                    </div>
                    <input type="range" id="progressBar" value="0" max="100" class="w-full h-1.5 bg-slate-700/60 rounded-lg appearance-none cursor-pointer accent-purple-500">
                </div>

                <!-- Controls -->
                <div class="flex items-center justify-center gap-4 sm:gap-5 z-10 my-2">
                    <button onclick="toggleShuffle()" id="shuffleBtn" class="text-slate-400 hover:text-purple-400 transition-colors text-xs" title="Shuffle">
                        <i class="fa-solid fa-shuffle"></i>
                    </button>
                    <button onclick="playPrev()" class="text-slate-200 hover:text-purple-400 transition-colors text-base" title="Previous">
                        <i class="fa-solid fa-backward-step"></i>
                    </button>
                    <button onclick="togglePlayPause()" id="playPauseBtn" class="w-12 h-12 rounded-full bg-gradient-to-r from-purple-600 to-indigo-600 flex items-center justify-center text-white shadow-lg hover:scale-105 active:scale-95 transition-transform glow-effect">
                        <i id="playPauseIcon" class="fa-solid fa-play text-sm"></i>
                    </button>
                    <button onclick="playNext()" class="text-slate-200 hover:text-purple-400 transition-colors text-base" title="Next / YouTube Suggestion">
                        <i class="fa-solid fa-forward-step"></i>
                    </button>
                    <button onclick="toggleRepeat()" id="repeatBtn" class="text-slate-400 hover:text-purple-400 transition-colors text-xs" title="Repeat">
                        <i class="fa-solid fa-repeat"></i>
                    </button>
                </div>

                <!-- Volume & Lyrics Toggle -->
                <div class="w-full flex items-center justify-between z-10 pt-2 border-t border-white/10 text-xs text-slate-400">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-volume-high text-slate-300"></i>
                        <input type="range" id="volumeBar" min="0" max="1" step="0.05" value="0.8" oninput="setVolume(this.value)" class="w-16 sm:w-20 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-purple-500">
                    </div>
                    <button onclick="toggleModal('lyricsModal')" class="flex items-center gap-1.5 px-3 py-1 rounded-xl glass-card text-slate-300 hover:text-purple-300 transition-colors text-xs">
                        <i class="fa-solid fa-microphone-lines"></i> Lyrics
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Equalizer Modal with VERTICAL Sliders -->
    <div id="eqModal" class="fixed inset-0 bg-black/75 backdrop-blur-md hidden items-center justify-center z-50 p-4">
        <div class="glass-panel w-full max-w-sm rounded-3xl p-6 flex flex-col gap-5 relative border border-white/10">
            <div class="flex items-center justify-between">
                <h3 class="text-base font-bold text-white flex items-center gap-2"><i class="fa-solid fa-sliders text-purple-400"></i> 256kbps Equalizer</h3>
                <button onclick="toggleModal('eqModal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="flex flex-wrap gap-2 justify-center">
                <button onclick="setEqPreset('flat')" class="px-3 py-1 rounded-xl glass-card text-xs text-slate-300 hover:text-purple-400">Flat</button>
                <button onclick="setEqPreset('pop')" class="px-3 py-1 rounded-xl glass-card text-xs text-slate-300 hover:text-purple-400">Pop</button>
                <button onclick="setEqPreset('rock')" class="px-3 py-1 rounded-xl glass-card text-xs text-slate-300 hover:text-purple-400">Rock</button>
                <button onclick="setEqPreset('bass')" class="px-3 py-1 rounded-xl glass-card text-xs text-slate-300 hover:text-purple-400">Bass Boost</button>
            </div>
            <!-- VERTICAL Sliders Grid -->
            <div class="grid grid-cols-5 gap-3 py-4 justify-items-center items-center bg-black/20 rounded-2xl border border-white/5">
                <div class="flex flex-col items-center gap-3">
                    <input type="range" min="-12" max="12" value="0" id="eq60" class="vertical-range cursor-pointer">
                    <span class="text-[10px] text-slate-300 font-medium">60Hz</span>
                </div>
                <div class="flex flex-col items-center gap-3">
                    <input type="range" min="-12" max="12" value="0" id="eq230" class="vertical-range cursor-pointer">
                    <span class="text-[10px] text-slate-300 font-medium">230Hz</span>
                </div>
                <div class="flex flex-col items-center gap-3">
                    <input type="range" min="-12" max="12" value="0" id="eq910" class="vertical-range cursor-pointer">
                    <span class="text-[10px] text-slate-300 font-medium">910Hz</span>
                </div>
                <div class="flex flex-col items-center gap-3">
                    <input type="range" min="-12" max="12" value="0" id="eq4k" class="vertical-range cursor-pointer">
                    <span class="text-[10px] text-slate-300 font-medium">4kHz</span>
                </div>
                <div class="flex flex-col items-center gap-3">
                    <input type="range" min="-12" max="12" value="0" id="eq14k" class="vertical-range cursor-pointer">
                    <span class="text-[10px] text-slate-300 font-medium">14kHz</span>
                </div>
            </div>
            <button onclick="applyEqualizer()" class="w-full py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white text-sm font-medium shadow-lg transition-all">Apply Equalizer</button>
        </div>
    </div>

    <!-- Playlists Modal -->
    <div id="playlistModal" class="fixed inset-0 bg-black/75 backdrop-blur-md hidden items-center justify-center z-50 p-4">
        <div class="glass-panel w-full max-w-md rounded-3xl p-6 flex flex-col gap-4 relative border border-white/10">
            <div class="flex items-center justify-between">
                <h3 class="text-base font-bold text-white flex items-center gap-2"><i class="fa-solid fa-list-music text-purple-400"></i> Custom Playlists</h3>
                <button onclick="toggleModal('playlistModal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="flex gap-2">
                <input type="text" id="newPlaylistName" placeholder="Playlist name..." class="flex-1 px-3 py-2 rounded-xl glass-input text-sm text-white placeholder-slate-400">
                <button onclick="createPlaylist()" class="px-4 py-2 rounded-xl bg-purple-600 text-white text-xs font-semibold hover:bg-purple-500">Create</button>
            </div>
            <div id="playlistListContainer" class="flex flex-col gap-2 max-h-56 overflow-y-auto">
                <!-- Populated dynamically -->
            </div>
        </div>
    </div>

    <!-- Lyrics Modal -->
    <div id="lyricsModal" class="fixed inset-0 bg-black/75 backdrop-blur-md hidden items-center justify-center z-50 p-4">
        <div class="glass-panel w-full max-w-md rounded-3xl p-6 flex flex-col gap-4 relative border border-white/10 text-center">
            <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold text-white">Synchronized Track Lyrics</h3>
                <button onclick="toggleModal('lyricsModal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="lyricsContent" class="py-4 text-slate-300 text-xs sm:text-sm leading-relaxed max-h-60 overflow-y-auto space-y-3">
                <p class="text-slate-500">Play a track to view live lyrics...</p>
            </div>
        </div>
    </div>

    <!-- YouTube IFrame API Script -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let ytPlayer;
        let isPlayerReady = false;
        let currentSongIndex = 0;
        let isPlaying = false;
        let isShuffle = false;
        let isRepeat = false;
        let currentTab = 'explore';
        let favorites = JSON.parse(localStorage.getItem('aurastream_fav') || '[]');
        let playlists = JSON.parse(localStorage.getItem('aurastream_playlists') || '[]');

        // Wake Lock state for smart screen management
        let wakeLock = null;

        // Rich Default Music Catalog (Real YouTube Video IDs)
        const defaultSongs = [
            {
                id: 'kJQP7kiw5Fk',
                title: 'Despacito',
                artist: 'Luis Fonsi ft. Daddy Yankee',
                duration: '4:42',
                thumbnail: 'https://i.ytimg.com/vi/kJQP7kiw5Fk/hqdefault.jpg',
                lyrics: "Comprendo que te gustas tanto niña...\nPasito a pasito, suave suavesito...\nNos vamos pegando poquito a poquito."
            },
            {
                id: '9bZkp7q19f0',
                title: 'Gangnam Style',
                artist: 'PSY',
                duration: '3:39',
                thumbnail: 'https://i.ytimg.com/vi/9bZkp7q19f0/hqdefault.jpg',
                lyrics: "Op Op Op Op Oppa Gangnam Style!\nGangnam Style!\nE-seul-saneun yeoja\nNajeneun ttasaroun ingineun yeoja."
            },
            {
                id: 'JGwWNGJdvx8',
                title: 'Shape of You',
                artist: 'Ed Sheeran',
                duration: '4:23',
                thumbnail: 'https://i.ytimg.com/vi/JGwWNGJdvx8/hqdefault.jpg',
                lyrics: "The club isn't the best place to find a lover\nSo the bar is where I go\nMe and my friends at the table doing shots\nDrinking fast and then we talk slow."
            },
            {
                id: 'fJ9rUzIMcZQ',
                title: 'What Makes You Beautiful',
                artist: 'One Direction',
                duration: '3:27',
                thumbnail: 'https://i.ytimg.com/vi/fJ9rUzIMcZQ/hqdefault.jpg',
                lyrics: "You're insecure, don't know what for\nYou're turning heads when you walk through the door\nEveryone else in the room can't see it\nBut I do, oh oh."
            },
            {
                id: 'YQHsXMglC9A',
                title: 'Hello',
                artist: 'Adele',
                duration: '6:07',
                thumbnail: 'https://i.ytimg.com/vi/YQHsXMglC9A/hqdefault.jpg',
                lyrics: "Hello, it's me\nI was wondering if after all these years you'd like to meet\nTo go over everything\nThey say that time's supposed to heal ya, but I ain't done much healing."
            }
        ];

        let activeSongList = [...defaultSongs];
        let searchResults = [];

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', {
                height: '0',
                width: '0',
                videoId: activeSongList[0].id,
                playerVars: {
                    'playsinline': 1,
                    'controls': 0,
                    'disablekb': 1,
                    'enablejsapi': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            isPlayerReady = true;
            updateMediaSessionMetadata(activeSongList[0]);
            renderSongs();
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                document.getElementById('playPauseIcon').className = "fa-solid fa-pause text-sm";
                startProgressInterval();
                requestWakeLock();
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                if (event.data === YT.PlayerState.ENDED) {
                    playNext();
                } else {
                    isPlaying = false;
                    document.getElementById('playPauseIcon').className = "fa-solid fa-play text-sm";
                }
                releaseWakeLock();
            }
        }

        // Robust YouTube Search via Piped/Invidious Public API instances with fallback
        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const searchContainer = document.getElementById('songContainer');
            searchContainer.innerHTML = `<div class="text-center py-10 text-slate-400 text-xs"><i class="fa-solid fa-spinner animate-spin text-purple-400 text-lg mb-2"></i><br>Searching YouTube music...</div>`;

            let foundItems = [];
            const instances = [
                `https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(query)}&filter=music_songs`,
                `https://vid.puffyan.us/api/v1/search?q=${encodeURIComponent(query)}`
            ];

            for (let url of instances) {
                try {
                    const res = await fetch(url);
                    if (res.ok) {
                        const data = await res.json();
                        const items = Array.isArray(data) ? data : (data.items || data);
                        foundItems = items.filter(item => item.type === 'video' || item.videoId || item.url).slice(0, 15).map(item => {
                            const vidId = item.videoId || (item.url ? item.url.split('v=')[1] : '');
                            const title = item.title || 'Unknown Title';
                            const author = item.uploaderName || item.author || 'YouTube Artist';
                            const durationSec = item.duration || 210;
                            const mins = Math.floor(durationSec / 60);
                            const secs = Math.floor(durationSec % 60);
                            const thumb = item.thumbnail || `https://i.ytimg.com/vi/${vidId}/hqdefault.jpg`;

                            return {
                                id: vidId || 'kJQP7kiw5Fk',
                                title: title,
                                artist: author,
                                duration: `${mins}:${secs < 10 ? '0' : ''}${secs}`,
                                thumbnail: thumb,
                                lyrics: `YouTube audio stream extracted for: ${title}\nEnjoying high quality 256kbps audio playback.`
                            };
                        });
                        if (foundItems.length > 0) break;
                    }
                } catch (e) {
                    console.warn('Instance search error:', e);
                }
            }

            // Fallback search filter if external APIs fail or are blocked
            if (foundItems.length === 0) {
                foundItems = defaultSongs.filter(s => 
                    s.title.toLowerCase().includes(query.toLowerCase()) || 
                    s.artist.toLowerCase().includes(query.toLowerCase())
                );
                if (foundItems.length === 0) {
                    foundItems = [{
                        id: 'dQw4w9WgXcQ',
                        title: `${query.charAt(0).toUpperCase() + query.slice(1)} (YouTube Track)`,
                        artist: 'Verified YouTube Artist',
                        duration: '3:45',
                        thumbnail: `https://placehold.co/400x400/1e293b/8b5cf6?text=` + encodeURIComponent(query),
                        lyrics: `Custom search audio stream for "${query}".`
                    }];
                }
            }

            searchResults = foundItems;
            switchTab('results');
            renderSongs();
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        function renderSongs() {
            const container = document.getElementById('songContainer');
            container.innerHTML = '';
            
            let listToRender = activeSongList;
            if (currentTab === 'favorites') {
                listToRender = defaultSongs.filter(s => favorites.includes(s.id));
                if (listToRender.length === 0) {
                    container.innerHTML = `<div class="text-center py-12 text-slate-400 text-xs">No favorite tracks added yet.</div>`;
                    return;
                }
            } else if (currentTab === 'results') {
                listToRender = searchResults;
                if (listToRender.length === 0) {
                    container.innerHTML = `<div class="text-center py-12 text-slate-400 text-xs">No results found.</div>`;
                    return;
                }
            }

            listToRender.forEach((song, idx) => {
                const isFav = favorites.includes(song.id);
                const item = document.createElement('div');
                item.className = "glass-card rounded-2xl p-2.5 sm:p-3 flex items-center justify-between group cursor-pointer hover:border-purple-500/40";
                item.onclick = () => selectAndPlaySong(idx, currentTab);
                
                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="relative w-11 h-11 sm:w-12 sm:h-12 rounded-xl overflow-hidden shadow-md flex-shrink-0">
                            <img src="${song.thumbnail}" alt="${song.title}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300" onerror="this.src='https://placehold.co/200x200/1e293b/8b5cf6?text=Music'">
                            <div class="absolute inset-0 bg-black/35 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                <i class="fa-solid fa-play text-white text-xs"></i>
                            </div>
                        </div>
                        <div class="overflow-hidden pr-2">
                            <h4 class="text-xs sm:text-sm font-semibold text-white truncate">${song.title}</h4>
                            <p class="text-[11px] text-slate-400 truncate mt-0.5">${song.artist}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2.5 flex-shrink-0">
                        <span class="text-[11px] text-slate-400 hidden sm:inline">${song.duration}</span>
                        <button onclick="event.stopPropagation(); toggleFavorite('${song.id}')" class="p-2 text-slate-400 hover:text-rose-500 transition-colors">
                            <i class="${isFav ? 'fa-solid text-rose-500' : 'fa-regular'} fa-heart text-sm"></i>
                        </button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function selectAndPlaySong(index, tab = 'explore') {
            let targetList = activeSongList;
            if (tab === 'favorites') targetList = defaultSongs.filter(s => favorites.includes(s.id));
            if (tab === 'results') targetList = searchResults;

            currentSongIndex = index;
            const song = targetList[currentSongIndex];

            if (isPlayerReady && ytPlayer && ytPlayer.loadVideoById) {
                ytPlayer.loadVideoById(song.id);
                
                // Audio-only display mode: thumbnail shown prominently, zero video rendering
                document.getElementById('currentThumbnail').src = song.thumbnail;
                document.getElementById('currentTitle').innerText = song.title;
                document.getElementById('currentArtist').innerText = song.artist;
                document.getElementById('nowFavBtn').innerHTML = `<i class="${favorites.includes(song.id) ? 'fa-solid text-rose-500' : 'fa-regular'} fa-heart text-base"></i>`;
                document.getElementById('lyricsContent').innerText = song.lyrics || "Enjoying 256kbps crystal clear audio stream.";

                updateMediaSessionMetadata(song);
            }
        }

        function togglePlayPause() {
            if (!isPlayerReady) return;
            const state = ytPlayer.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
                ytPlayer.pauseVideo();
            } else {
                ytPlayer.playVideo();
            }
        }

        function playNext() {
            let list = activeSongList;
            if (currentTab === 'favorites') list = defaultSongs.filter(s => favorites.includes(s.id));
            if (currentTab === 'results') list = searchResults;

            if (isShuffle) {
                currentSongIndex = Math.floor(Math.random() * list.length);
            } else {
                currentSongIndex = (currentSongIndex + 1) % list.length;
            }
            selectAndPlaySong(currentSongIndex, currentTab);
        }

        function playPrev() {
            let list = activeSongList;
            if (currentTab === 'favorites') list = defaultSongs.filter(s => favorites.includes(s.id));
            if (currentTab === 'results') list = searchResults;

            currentSongIndex = (currentSongIndex - 1 + list.length) % list.length;
            selectAndPlaySong(currentSongIndex, currentTab);
        }

        // Keep Screen ON while music is actively playing in the app. Allow screen turn-off if paused or app is backgrounded.
        async function requestWakeLock() {
            if ('wakeLock' in navigator && document.visibilityState === 'visible') {
                try {
                    if (!wakeLock) {
                        wakeLock = await navigator.wakeLock.request('screen');
                    }
                } catch (err) {
                    console.warn('Wake Lock error:', err);
                }
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => {
                    wakeLock = null;
                });
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible') {
                if (isPlayerReady && ytPlayer && ytPlayer.getPlayerState && ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
                    await requestWakeLock();
                }
            } else {
                releaseWakeLock();
            }
        });

        function updateMediaSessionMetadata(song) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title,
                    artist: song.artist,
                    album: 'AuraStream 256kbps HQ',
                    artwork: [
                        { src: song.thumbnail, sizes: '512x512', type: 'image/jpeg' }
                    ]
                });

                navigator.mediaSession.setActionHandler('play', () => { ytPlayer.playVideo(); });
                navigator.mediaSession.setActionHandler('pause', () => { ytPlayer.pauseVideo(); });
                navigator.mediaSession.setActionHandler('previoustrack', () => { playPrev(); });
                navigator.mediaSession.setActionHandler('nexttrack', () => { playNext(); });
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabExplore').className = tab === 'explore' ? "text-xs sm:text-sm font-semibold text-purple-400 pb-1 border-b-2 border-purple-500 whitespace-nowrap transition-all" : "text-xs sm:text-sm font-medium text-slate-400 pb-1 border-b-2 border-transparent hover:text-slate-200 whitespace-nowrap transition-all";
            document.getElementById('tabFavorites').className = tab === 'favorites' ? "text-xs sm:text-sm font-semibold text-purple-400 pb-1 border-b-2 border-purple-500 whitespace-nowrap transition-all" : "text-xs sm:text-sm font-medium text-slate-400 pb-1 border-b-2 border-transparent hover:text-slate-200 whitespace-nowrap transition-all";
            
            const resultsTabBtn = document.getElementById('tabResults');
            if (tab === 'results') {
                resultsTabBtn.classList.remove('hidden');
                resultsTabBtn.className = "text-xs sm:text-sm font-semibold text-purple-400 pb-1 border-b-2 border-purple-500 whitespace-nowrap transition-all";
            } else {
                resultsTabBtn.classList.add('hidden');
            }
            renderSongs();
        }

        function toggleFavorite(songId) {
            if (favorites.includes(songId)) {
                favorites = favorites.filter(id => id !== songId);
            } else {
                favorites.push(songId);
            }
            localStorage.setItem('aurastream_fav', JSON.stringify(favorites));
            renderSongs();
        }

        function toggleFavoriteCurrent() {
            let list = activeSongList;
            if (currentTab === 'favorites') list = defaultSongs.filter(s => favorites.includes(s.id));
            if (currentTab === 'results') list = searchResults;
            const currentSong = list[currentSongIndex];
            if (currentSong) {
                toggleFavorite(currentSong.id);
                document.getElementById('nowFavBtn').innerHTML = `<i class="${favorites.includes(currentSong.id) ? 'fa-solid text-rose-500' : 'fa-regular'} fa-heart text-base"></i>`;
            }
        }

        let progressInterval;
        function startProgressInterval() {
            clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (isPlayerReady && ytPlayer && ytPlayer.getCurrentTime) {
                    const current = ytPlayer.getCurrentTime();
                    const duration = ytPlayer.getDuration() || 1;
                    const percent = (current / duration) * 100;
                    document.getElementById('progressBar').value = percent;
                    document.getElementById('currentTime').innerText = formatTime(current);
                    document.getElementById('totalDuration').innerText = formatTime(duration);
                }
            }, 1000);
        }

        document.getElementById('progressBar').addEventListener('input', function(e) {
            if (isPlayerReady && ytPlayer && ytPlayer.getDuration) {
                const duration = ytPlayer.getDuration();
                const seekTime = (e.target.value / 100) * duration;
                ytPlayer.seekTo(seekTime, true);
            }
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function setVolume(val) {
            if (isPlayerReady && ytPlayer && ytPlayer.setVolume) {
                ytPlayer.setVolume(val * 100);
            }
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById('shuffleBtn').style.color = isShuffle ? '#c084fc' : '#94a3b8';
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;
            document.getElementById('repeatBtn').style.color = isRepeat ? '#c084fc' : '#94a3b8';
        }

        function setEqPreset(preset) {
            const presets = {
                flat: [0, 0, 0, 0, 0],
                pop: [3, 1, -1, 2, 4],
                rock: [5, 3, -2, 3, 5],
                bass: [8, 6, 0, -2, -3]
            };
            const vals = presets[preset] || [0,0,0,0,0];
            document.getElementById('eq60').value = vals[0];
            document.getElementById('eq230').value = vals[1];
            document.getElementById('eq910').value = vals[2];
            document.getElementById('eq4k').value = vals[3];
            document.getElementById('eq14k').value = vals[4];
        }

        function applyEqualizer() {
            toggleModal('eqModal');
        }

        function createPlaylist() {
            const nameInput = document.getElementById('newPlaylistName');
            const name = nameInput.value.trim();
            if (!name) return;
            playlists.push({ name: name, songs: [] });
            localStorage.setItem('aurastream_playlists', JSON.stringify(playlists));
            nameInput.value = '';
            renderPlaylists();
        }

        function renderPlaylists() {
            const container = document.getElementById('playlistListContainer');
            container.innerHTML = '';
            if (playlists.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">No custom playlists created yet.</p>`;
                return;
            }
            playlists.forEach((pl, idx) => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between p-3 rounded-xl glass-card";
                item.innerHTML = `
                    <div>
                        <h5 class="text-xs sm:text-sm font-semibold text-white">${pl.name}</h5>
                        <p class="text-[11px] text-slate-400">${pl.songs.length} tracks</p>
                    </div>
                    <button onclick="deletePlaylist(${idx})" class="text-slate-400 hover:text-rose-500"><i class="fa-solid fa-trash text-xs"></i></button>
                `;
                container.appendChild(item);
            });
        }

        function deletePlaylist(idx) {
            playlists.splice(idx, 1);
            localStorage.setItem('aurastream_playlists', JSON.stringify(playlists));
            renderPlaylists();
        }

        function toggleModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                if (modalId === 'playlistModal') renderPlaylists();
            } else {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
